<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="Algef Almocera">
<meta property="og:description" content="Former Director of Engineering with 20+ years of hands-on software development experience.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --umber:#17120c; --umber-glass:rgba(23,18,12,.46); --linen:#ece5d6; --linen-dim:rgba(236,229,214,.72);
  --label:#e9e3d5; --label-ink:#2a2219; --gilt:#c8a560;
  --display:"Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --ui:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --umber:#120e09; --umber-glass:rgba(18,14,9,.5); } }
:root[data-theme="dark"]{ --umber:#120e09; --umber-glass:rgba(18,14,9,.5); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; background:var(--umber); color:var(--linen); }
body{ font-family:var(--ui); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
#spacer{ width:1px; }

.stage{ position:fixed; inset:0; overflow:hidden; background:var(--umber); }
.world{ position:absolute; inset:0; transition:opacity 1.1s ease; }
.layer{ position:absolute; left:0; top:0; will-change:transform; transition:filter .9s cubic-bezier(.2,.7,.2,1); }
.layer canvas{ position:absolute; top:0; display:block; }
#life{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.fx{ position:absolute; inset:0; pointer-events:none; }
.fx.weave{ mix-blend-mode:multiply; opacity:.32; }
.fx.crack{ mix-blend-mode:multiply; background-size:512px 512px; }
.fx.varnish{ mix-blend-mode:multiply; }
.fx.vignette{ background:radial-gradient(120% 95% at 50% 46%, transparent 52%, rgba(12,8,4,.5) 100%); }
.fx.scrim{ background:linear-gradient(to bottom, rgba(12,9,6,.42), transparent 18%, transparent 78%, rgba(12,9,6,.5)); }
.fx.grain{ inset:-50%; opacity:.07; mix-blend-mode:overlay; animation:grain .9s steps(6) infinite; }
@keyframes grain{ 0%{transform:translate(0,0)} 20%{transform:translate(-7%,4%)} 40%{transform:translate(5%,-6%)} 60%{transform:translate(-3%,8%)} 80%{transform:translate(8%,2%)} 100%{transform:translate(0,0)} }

/* HUD */
.hud{ position:fixed; left:0; right:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 clamp(16px,3vw,40px); pointer-events:none; }
.hud > *{ pointer-events:auto; }
.hud.top{ top:0; padding-top:calc(env(safe-area-inset-top,0px) + 20px); }
.brand{ font-family:var(--display); font-size:22px; line-height:1; letter-spacing:.01em; font-weight:400; }
.brand small{ display:block; font-family:var(--ui); font-size:12px; letter-spacing:.02em; color:var(--linen-dim); margin-top:6px; }
.controls{ display:flex; gap:8px; align-items:center; }
.chip, select.chip{ font:500 13px/1 var(--ui); color:var(--linen); background:var(--umber-glass); border:1px solid rgba(236,229,214,.22); border-radius:999px; padding:10px 16px; cursor:pointer; backdrop-filter:blur(10px) saturate(1.2); -webkit-backdrop-filter:blur(10px) saturate(1.2); transition:background .25s, border-color .25s; }
select.chip{ appearance:none; -webkit-appearance:none; padding-right:30px; background-image:linear-gradient(45deg,transparent 50%,var(--linen) 50%),linear-gradient(135deg,var(--linen) 50%,transparent 50%); background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
select.chip option{ color:#1b150f; }
.chip:hover{ background:rgba(23,18,12,.7); border-color:rgba(236,229,214,.45); }
.chip:focus-visible, input[type=range]:focus-visible{ outline:2px solid var(--gilt); outline-offset:3px; }

.intro{ position:fixed; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:0 24px; }
.intro h1{ font-family:var(--display); font-weight:300; font-size:clamp(46px,8.2vw,128px); line-height:.92; letter-spacing:-.02em; margin:0; text-shadow:0 2px 40px rgba(0,0,0,.25); }
.intro h1 span{ display:block; font-style:italic; }
.sky-light .intro h1, .sky-light .intro p{ color:#2b241b; text-shadow:0 1px 18px rgba(240,232,214,.6); }
.sky-light .hint{ color:rgba(43,36,27,.7); }
.sky-light .hint i{ background:linear-gradient(#2b241b,transparent); }
.intro p{ font-family:var(--display); font-size:clamp(17px,1.6vw,22px); font-style:italic; color:var(--linen); opacity:.9; margin:22px 0 0; max-width:34em; line-height:1.45; text-shadow:0 1px 14px rgba(0,0,0,.35); }
.hint{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 34px); transform:translateX(-50%); z-index:4; font-size:12px; letter-spacing:.04em; color:var(--linen-dim); display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; }
.hint i{ display:block; width:1px; height:42px; background:linear-gradient(var(--linen),transparent); animation:drip 2.2s ease-in-out infinite; transform-origin:top; }
@keyframes drip{ 0%{transform:scaleY(0)} 50%{transform:scaleY(1)} 100%{transform:scaleY(1); opacity:0} }

/* museum wall label */
.placard{ position:fixed; z-index:5; left:clamp(16px,3vw,40px); bottom:calc(env(safe-area-inset-bottom,0px) + 74px); width:min(360px, calc(100vw - 32px)); background:var(--label); color:var(--label-ink); padding:20px 22px 18px; border-radius:2px; box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 18px 50px rgba(10,6,2,.35); opacity:0; transform:translateY(10px); transition:opacity .45s ease, transform .45s ease; pointer-events:none; }
.placard.show{ opacity:1; transform:none; }
.placard .no{ font-family:var(--display); font-size:15px; font-style:italic; color:#7a6646; }
.placard h3{ font-family:var(--display); font-weight:500; font-size:27px; line-height:1.05; margin:2px 0 10px; }
.placard p{ font-size:13.5px; line-height:1.55; margin:0 0 12px; color:#3d3326; }
.placard .eq:empty{ display:none; }
.reveal-none{}
a.chip{ text-decoration:none; display:inline-block; }
.intro p{ max-width:min(34em, 100%); }
@media (max-width:640px){ #school, #reroll{ display:none; } }
.placard .eq{ font-family:var(--display); font-style:italic; font-size:17px; line-height:1.35; color:#2a2219; border-top:1px solid rgba(42,34,25,.18); padding-top:10px; }

.hud.bottom{ bottom:0; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px); align-items:flex-end; }
.progress{ flex:1; max-width:520px; margin:0 auto; position:relative; height:28px; }
.progress .track{ position:absolute; left:0; right:0; bottom:8px; height:1px; background:rgba(236,229,214,.28); }
.progress .bar{ position:absolute; left:0; bottom:8px; height:1px; background:var(--linen); width:0; }
.progress .tick{ position:absolute; bottom:14px; transform:translateX(-50%); font-family:var(--display); font-size:13px; font-style:italic; color:var(--linen-dim); transition:color .3s; }
.progress .tick.on{ color:var(--linen); }
.lens{ display:flex; gap:18px; align-items:center; background:var(--umber-glass); border:1px solid rgba(236,229,214,.18); border-radius:14px; padding:10px 14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.lens label{ display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--linen-dim); }
.lens label b{ font-weight:500; color:var(--linen); }
input[type=range]{ -webkit-appearance:none; appearance:none; width:110px; height:16px; background:transparent; }
input[type=range]::-webkit-slider-runnable-track{ height:1px; background:rgba(236,229,214,.4); }
input[type=range]::-moz-range-track{ height:1px; background:rgba(236,229,214,.4); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--linen); margin-top:-6px; border:0; }
input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--linen); border:0; }

.focus-ring{ position:fixed; z-index:6; width:90px; height:90px; margin:-45px 0 0 -45px; border:1px solid var(--linen); border-radius:50%; pointer-events:none; opacity:0; }
.focus-ring.go{ animation:rack .9s cubic-bezier(.2,.7,.2,1); }
@keyframes rack{ 0%{opacity:.9; transform:scale(1.4)} 60%{opacity:.8; transform:scale(.35)} 100%{opacity:0; transform:scale(.3)} }
.cursor{ position:fixed; z-index:7; left:0; top:0; width:28px; height:28px; margin:-14px 0 0 -14px; border:1px solid rgba(236,229,214,.8); border-radius:50%; pointer-events:none; mix-blend-mode:difference; transition:width .2s, height .2s, margin .2s; }
.cursor.hide{ display:none; }

.fin{ position:fixed; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px; opacity:0; pointer-events:none; background:radial-gradient(70% 60% at 50% 50%, rgba(14,10,6,.55), rgba(14,10,6,.15)); }
.fin.on{ pointer-events:auto; }
.fin h2{ font-family:var(--display); font-weight:300; font-style:italic; font-size:clamp(64px,10vw,150px); line-height:.9; margin:0; }
.fin p{ font-family:var(--display); font-size:clamp(17px,1.5vw,21px); line-height:1.5; max-width:30em; margin:18px 0 28px; color:var(--linen); }
.fin .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.seal{ width:54px; height:54px; margin-bottom:22px; background:#a8322a; color:#f4e9dc; border-radius:3px; display:grid; place-items:center; font:500 20px/1 "Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; letter-spacing:.05em; box-shadow:inset 0 0 0 3px #a8322a, inset 0 0 0 4px #f4e9dc; transform:rotate(-3deg); }

.loader{ position:fixed; inset:0; z-index:20; background:rgba(18,13,8,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .9s ease; }
.loader.soft{ background:rgba(18,13,8,.62); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.loader.gone{ opacity:0; pointer-events:none; }
.loader .msg{ font-family:var(--display); font-style:italic; font-size:clamp(22px,2.4vw,32px); }
.loader .meter{ width:min(280px,60vw); height:1px; background:rgba(236,229,214,.2); position:relative; overflow:hidden; }
.loader .meter i{ position:absolute; inset:0; background:var(--linen); transform-origin:left; transform:scaleX(0); transition:transform .25s; }
.loader small{ font-size:12px; color:var(--linen-dim); }
.toast{ position:fixed; z-index:9; left:50%; top:calc(env(safe-area-inset-top,0px) + 76px); transform:translate(-50%,-6px); background:var(--label); color:var(--label-ink); font-size:13px; padding:9px 14px; border-radius:2px; opacity:0; transition:.3s; pointer-events:none; }
.toast.on{ opacity:1; transform:translate(-50%,0); }

@media (max-width:760px){
  .brand{ font-size:19px; }
  .brand small{ display:none; }
  #school{ display:none; }
  .placard{ bottom:calc(env(safe-area-inset-bottom,0px) + 96px); padding:14px 16px 12px; }
  .placard h3{ font-size:22px; } .placard p{ font-size:12.5px; margin-bottom:8px; }
  .hud.bottom{ flex-direction:column-reverse; align-items:stretch; gap:10px; }
  .lens{ justify-content:center; }
  .progress{ width:100%; }
  input[type=range]{ width:96px; }
  .cursor{ display:none; }
}
@media (hover:none){ .cursor{ display:none; } }
@media (prefers-reduced-motion: reduce){ .fx.grain{ animation:none; } .hint i{ animation:none; } }
</style>
</head>
<body>

</div>

  <div class="controls">

  <div class="row">
    <a class="chip" href="/talks/">Talks and resources</a>
    <a class="chip" href="https://www.linkedin.com/in/algef-almocera-666a2b35/" rel="me noopener" target="_blank">LinkedIn</a>
    <a class="chip" href="https://www.instagram.com/algef.almocera/" rel="me noopener" target="_blank">Instagram</a>
    <button class="chip" id="again">Paint another</button>

</section>

<script>
"use strict";
/* =====================================================================
   STOCHASTIC FRESCOES
   paintMural(seed, school, vw, vh) is the generator: it returns a stack
   of parallax layers, each a display list of brush operations produced
   by stochastic processes (fBm, Poisson & Neyman–Scott point processes,
   Lévy flights, random-walk cracks, stochastic L-systems).
   ===================================================================== */
const TAU = Math.PI * 2;
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const TILE = 2048;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- randomness ---------- */
function RNG(seed){
  let s = seed >>> 0;
  const r = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => Math.floor(r.range(lo, hi + 1));
  r.pick = a => a[Math.floor(r() * a.length)];
  r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  r.exp = mean => -Math.log(1 - r()) * mean;
  r.pareto = (xm, alpha) => xm / Math.pow(1 - r(), 1 / alpha);
  r.poisson = lambda => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= r(); } while (p > L && k < 200); return k - 1; };
  r.chance = p => r() < p;
  r.seed = () => Math.floor(r() * 4294967295);
  return r;
}
function Perlin(rng){
  const perm = new Uint8Array(512), p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const n = (x, y = 0) => {
    let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255;
    const u = fade(x), v = fade(y), A = perm[X] + Y, B = perm[X + 1] + Y;
    return lerp(lerp(g(perm[A], x, y), g(perm[B], x - 1, y), u), lerp(g(perm[A + 1], x, y - 1), g(perm[B + 1], x - 1, y - 1), u), v);
  };
  // fractional Brownian motion: sum of octaves, amplitude 2^(-iH)
  n.fbm = (x, y = 0, oct = 5, H = .7) => { let s = 0, a = 1, f = 1, norm = 0; const gain = Math.pow(2, -H); for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); norm += a; a *= gain; f *= 2; } return s / norm; };
  // ridged multifractal
  n.ridged = (x, y = 0, oct = 5) => { let s = 0, a = .5, f = 1, prev = 1, norm = 0; for (let i = 0; i < oct; i++) { let v = 1 - Math.abs(n(x * f, y * f)); v *= v; v *= prev; prev = Math.min(1, v * 1.6); s += v * a; norm += a; a *= .5; f *= 2.1; } return s / norm; };
  return n;
}

/* ---------- colour ---------- */
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const shade = (c, k) => k >= 0 ? mix(c, [255, 255, 255], k) : mix(c, [0, 0, 0], -k);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const deepHex = o => { if (typeof o === 'string' && o[0] === '#') return hex(o); if (Array.isArray(o)) return o.map(deepHex); if (o && typeof o === 'object') { const r = {}; for (const k in o) r[k] = deepHex(o[k]); return r; } return o; };

/* ---------- schools (palettes + painterly behaviour) ---------- */
const SCHOOLS_RAW = {
  arcadia: { name:'Arcadia', after:'after Claude Lorrain, at golden hour', style:'oil',
    a:{ zen:'#4f6a88', top:'#7795ae', mid:'#c0cbc3', hor:'#f2deb0', haze:'#dcd5bc', sun:'#fff3d4' },
    b:{ zen:'#2b3654', top:'#53658a', mid:'#c99c7c', hor:'#f4b46e', haze:'#e0b98f', sun:'#ffd28a' },
    celestial:'sun', glow:.62, sunR:.038, cloud:{ kind:'cumulus', lit:'#fff2da', shade:'#8a919c' },
    ranges:['#8e9eab','#73858a','#56665c'], snow:'#eef0ee', water:'#7f9497', hills:'#647040', hillsDark:'#2d3420',
    fields:['#a99a52','#4f6a33'], foliage:['#2b351c','#3f4d26','#5a6935','#7b8746'], fg:'#1b1d12', fgFol:['#161c0f','#1f2814','#2b361b','#3a4724'],
    accents:['#d8b45a','#c4593c','#efe2c0'], trees:['round','round','cypress','umbrella'], fgTree:'broadleaf', building:'temple',
    stone:'#d9cbb0', particles:'motes', bird:'#2a2a24', varnish:['#b88a3d',.16], cracks:.26, flowers:true, boats:'sail', strokes:1 },
  shanshui: { name:'Shan Shui', after:'ink and mist, after the Song masters', style:'ink',
    a:{ zen:'#d6c9ae', top:'#e3d8c1', mid:'#ebe1cc', hor:'#efe6d3', haze:'#f0e8d6', sun:'#c4513a' },
    b:{ zen:'#cfc0a2', top:'#ddd0b5', mid:'#e8ddc5', hor:'#eee4cf', haze:'#efe6d2', sun:'#b8452f' },

  { t:'Still water', p:`Ripples are horizontal strokes sampled on a power-law perspective, so they crowd and shrink toward the horizon. ${m.boats ? m.boats + ' boats drifted in' : 'No boats arrived'} by Poisson arrival.`, f:'y = h + (H − h)·u^1.6,  u ~ U(0, 1)' },
  { t:'The grove', p:`${m.trees} trees seeded themselves in clusters: a Neyman–Scott process scatters parents, children fall in Gaussian clouds, and every branch forks by a stochastic L-system.`, f:'θ′ = θ ± U(0.22, 0.55) + N(0, 0.18²)' },
  { t:'Flight', p:'Birds wander by Lévy flight: mostly short glides, now and then a long heavy-tailed leap. Fireflies drift by Ornstein–Uhlenbeck noise.', f:`P(ℓ) ∝ ℓ^(−1−α),  α = ${m.alpha.toFixed(2)}` },
  { t:'Patina', p:'Age is stochastic too. The craquelure is a Voronoi tessellation of randomly scattered seeds, and a varnish yellows over everything.', f:'crack where d₂(x) − d₁(x) < ε' },
];
const NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

function dims(){ const vw = innerWidth, vh = innerHeight; return { vw, vh, A:vh * 1.1, B:Math.max(vw * 3.2, 2600), C:vh * .9 }; }
const tick = () => new Promise(r => setTimeout(r, 0));

async function build(seed, school, soft){
  const id = ++building;
  const loader = $('#loader'); loader.classList.toggle('soft', !!soft); loader.classList.remove('gone');
  $('#meter').style.transform = 'scaleX(0)';
  $('#loadMsg').textContent = 'Grinding pigments'; $('#loadSub').textContent = `${SCHOOLS[school].name}, ${SCHOOLS[school].after}`;
  await tick(); await tick();
  const D = dims(), mural = paintMural({ seed, school, vw:D.vw, vh:D.vh });
  const world = document.createElement('div'); world.className = 'world'; world.style.opacity = '0';
  let total = 0, done = 0; for (const L of mural.layers) total += Math.ceil(L.w / TILE);
  for (const L of mural.layers) {
    if (id !== building) return;
    $('#loadMsg').textContent = L.label;
    const el = document.createElement('div'); el.className = 'layer'; el.style.width = L.w + 'px'; el.style.height = L.h + 'px';
    L.el = el; L.tiles = []; L.scale = L.res * DPR; world.appendChild(el);
    for (let x0 = 0; x0 < L.w; x0 += TILE) {
      const tw = Math.min(TILE, L.w - x0), cv = document.createElement('canvas');
      cv.width = Math.ceil(tw * L.scale); cv.height = Math.ceil(L.h * L.scale);
      cv.style.left = x0 + 'px'; cv.style.width = (cv.width / L.scale) + 'px'; cv.style.height = (cv.height / L.scale) + 'px';
      const c = cv.getContext('2d'); c.setTransform(L.scale, 0, 0, L.scale, -x0 * L.scale, 0);
      for (const op of L.ops) if (op.x1 >= x0 - 2 && op.x0 <= x0 + tw + 2) op.f(c);
      el.appendChild(cv); L.tiles.push(cv);
      done++; $('#meter').style.transform = `scaleX(${done / total})`;
      await tick(); if (id !== building) return;
    }
    L.ops = null;
  }
  // textures
  const P = mural.P;
  $('#fxWeave').style.backgroundImage = `url(${weaveTile(seed, P.style === 'ink')})`;
  $('#fxWeave').style.opacity = P.style === 'ink' ? .42 : .3;
  const fc = $('#fxCrack'); fc.style.backgroundImage = `url(${crackTile(seed ^ 77)})`; fc.style.opacity = P.cracks;
  const fv = $('#fxVarnish'); fv.style.background = rgb(P.varnish[0]); fv.style.opacity = P.varnish[1];

  const old = state; $('#stage').insertBefore(world, lifeCv);
  state = { seed, school, mural, D, world, life:makeLife(P, mural.meta, seed, D.vw, D.vh), chapters:chaptersOf(mural.meta).map((c, i) => BIO[i] ? { t:BIO[i][0], p:BIO[i][1], f:'' } : c), chapter:-1 };
  $('#spacer').style.height = (D.A + D.B + D.C + D.vh) + 'px';
  applyLens(true); updateTexts(); setupProgress();
  requestAnimationFrame(() => { world.style.opacity = '1'; });
  if (old) setTimeout(() => old.world.remove(), 1200);
  loader.classList.add('gone');
  history.replaceState(null, '', `#seed=${seed}&school=${school}`);
}

function updateTexts(){
  const { seed, school } = state, P = SCHOOLS[school], no = String(seed % 100000).padStart(5, '0');
  $('#opus').textContent = `Opus ${no}, ${P.name}`;
  $('#finText').textContent = `This painting is Opus ${no} of Stochastic Frescoes, a generator I wrote. It is painted by chance on every visit, and its seed will always paint it again, stroke for stroke.`;
  $('#seal').hidden = school !== 'shanshui';
  document.body.classList.toggle('sky-light', school === 'shanshui');
  
}
function setupProgress(){
  const pr = $('#progress'); pr.querySelectorAll('.tick').forEach(e => e.remove());
  NUMERALS.forEach((n, i) => { const t = document.createElement('span'); t.className = 'tick'; t.textContent = n; t.style.left = ((i + .5) / 7 * 100) + '%'; pr.appendChild(t); });
}

function blurFor(L){ const d = L.d; const b = aperture * (d < focus ? (focus - d) * 10 : (d - focus) * 20); return b + (L.mist ? 3 : 0); }
function applyLens(instant){
  if (!state) return;
  for (const L of state.mural.layers) { if (instant) L.el.style.transition = 'none'; const b = blurFor(L); L.el.style.filter = b > .25 ? `blur(${b.toFixed(2)}px)` : 'none'; if (instant) requestAnimationFrame(() => L.el.style.transition = ''); }
  $('#focusVal').textContent = focus < .2 ? 'Far ranges' : focus < .45 ? 'Distance' : focus < .78 ? 'Middle ground' : 'Foreground';
  const f = 16 * Math.pow(1.4 / 16, aperture); $('#apVal').textContent = 'f/' + (f < 4 ? f.toFixed(1) : Math.round(f));
}
$('#focus').addEventListener('input', e => { focus = +e.target.value; applyLens(); });
$('#aperture').addEventListener('input', e => { aperture = +e.target.value; applyLens(); });

/* placards */
let placardTimer = 0;
function showChapter(i){
  const el = $('#placard');
  if (i === state.chapter) return; state.chapter = i; clearTimeout(placardTimer);
  el.classList.remove('show');
  if (i < 0) return;
  placardTimer = setTimeout(() => { const ch = state.chapters[i]; $('#pNo').textContent = NUMERALS[i] + '.'; $('#pTitle').textContent = ch.t; $('#pText').textContent = ch.p; $('#pEq').textContent = ch.f; el.classList.add('show'); }, 260);
  document.querySelectorAll('.progress .tick').forEach((t, k) => t.classList.toggle('on', k <= i));
}

/* frame loop */
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (state) {
    const { mural, D } = state, { vw, vh } = D;
    cur += (scrollY - cur) * (REDUCED ? 1 : 1 - Math.exp(-dt * 7));
    mx += (tmx - mx) * (1 - Math.exp(-dt * 3)); my += (tmy - my) * (1 - Math.exp(-dt * 3));
    const a = clamp(cur / D.A), pB = clamp((cur - D.A) / D.B), pC = clamp((cur - D.A - D.B) / D.C);
    const down = 1 - smooth(a), tilt = vh * .55, crane = vh * .75, travel = pB * mural.T;
    for (const L of mural.layers) {
      let tx = -mural.M - travel * L.speed + mx * L.d * 26;
      if (L.mist) tx += Math.sin(now / 1000 * .06 + L.ph) * 50;
      const ty = L.top + down * (tilt + L.d * crane) + my * L.d * 14 + Math.sin(pB * Math.PI * 2) * L.d * vh * .012;
      if (L.fade) L.el.style.opacity = smooth(pB).toFixed(3);
      L.tx = tx; L.ty = ty; L.el.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0)`;
    }
    // life
    const dWorld = travel - lastTravel; lastTravel = travel;
    stepLife(state.life, lifeCtx, dt, now / 1000, dWorld, down * (tilt + crane * .6), innerWidth, innerHeight);
    // overlays
    $('#intro').style.opacity = clamp(1 - a * 1.7); $('#intro').style.transform = `translateY(${-a * 60}px)`;
    $('#hint').style.opacity = clamp(1 - a * 4);
    $('#bar').style.width = (pB * 100) + '%';
    const fin = $('#fin'); fin.style.opacity = smooth(pC); fin.classList.toggle('on', pC > .5);
    showChapter(a > .97 && pC < .25 ? Math.min(6, Math.floor(pB * 7)) : -1);
  }
  requestAnimationFrame(frame);
}

/* life canvas sizing */
function sizeLife(){ const d = Math.min(devicePixelRatio || 1, 2); lifeCv.width = innerWidth * d; lifeCv.height = innerHeight * d; lifeCtx.setTransform(d, 0, 0, d, 0, 0); }
sizeLife();

/* input */
addEventListener('pointermove', e => { tmx = e.clientX / innerWidth * 2 - 1; tmy = e.clientY / innerHeight * 2 - 1; const cu = $('#cursor'); if (e.pointerType === 'mouse') cu.classList.remove('hide'); cu.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; });
addEventListener('wheel', e => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) scrollBy(0, e.deltaX); }, { passive:true });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') scrollBy({ top:innerWidth * .4, behavior:'smooth' }); if (e.key === 'ArrowLeft') scrollBy({ top:-innerWidth * .4, behavior:'smooth' }); });
// rack focus: sample the nearest opaque layer under the pointer
let downAt = null;
addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
addEventListener('pointerup', e => {
  if (!state || !downAt || e.target.closest('button,select,input,.lens,.fin.on .row')) return;
  if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  let d = 0;
  for (const L of [...state.mural.layers].reverse()) {
    if (L.mist || (L.fade && L.el.style.opacity < .5)) continue;
    const lx = e.clientX - L.tx, ly = e.clientY - L.ty; if (lx < 0 || ly < 0 || lx >= L.w || ly >= L.h) continue;
    const ti = Math.floor(lx / TILE), cv = L.tiles[ti]; if (!cv) continue;
    try { const px = cv.getContext('2d').getImageData(Math.floor((lx - ti * TILE) * L.scale), Math.floor(ly * L.scale), 1, 1).data; if (px[3] > 200) { d = L.d; break; } } catch (err) {}
  }
  focus = d; $('#focus').value = d; applyLens();
  const ring = $('#ring'); ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px'; ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
});

function newSeed(){ return Math.floor(Math.random() * 4294967295); }
function pickSchool(){ const v = schoolSel.value; return v === 'random' ? Object.keys(SCHOOLS)[Math.floor(Math.random() * 6)] : v; }
$('#reroll').addEventListener('click', () => build(newSeed(), pickSchool(), true));
$('#again').addEventListener('click', () => { scrollTo({ top:0 }); cur = 0; build(newSeed(), pickSchool(), true); });
schoolSel.addEventListener('change', () => build(newSeed(), pickSchool(), true));
$('#copy').addEventListener('click', async () => { let ok = true; try { await navigator.clipboard.writeText(location.href); } catch (e) { ok = false; } const t = $('#toast'); t.textContent = ok ? 'Link copied. The seed will repaint this exact mural.' : 'Copy the address bar link to share this mural.'; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); });

let rsz = 0, lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => { sizeLife(); clearTimeout(rsz); rsz = setTimeout(() => { if (!state) return; const dw = Math.abs(innerWidth - lastW) / lastW, dh = Math.abs(innerHeight - lastH) / lastH; if (dw > .12 || dh > .25) { lastW = innerWidth; lastH = innerHeight; const p = scrollY / Math.max(1, document.body.scrollHeight); build(state.seed, state.school, true).then(() => scrollTo(0, p * document.body.scrollHeight)); } }, 450); });

/* boot */
(function(){
  if (!document.querySelector('.fx.grain').style.backgroundImage) document.querySelector('.fx.grain').style.backgroundImage = `url(${grainTile()})`;
  const h = new URLSearchParams(location.hash.slice(1));
  const seed = h.has('seed') ? (parseInt(h.get('seed'), 10) >>> 0) : newSeed();
  const sch = SCHOOLS[h.get('school')] ? h.get('school') : Object.keys(SCHOOLS)[Math.floor(Math.random() * 6)];
  if (h.has('school') && SCHOOLS[h.get('school')]) schoolSel.value = 'random';
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
  build(seed, sch, false);
  requestAnimationFrame(frame);
})();
</script>
</body>
