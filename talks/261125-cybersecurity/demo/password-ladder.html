<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Password Ladder</title>
<link rel="stylesheet" href="fonts/inter.css">
<style>
  /* Password Ladder demo (slide 117). One table, eight steps, each defeats the one before.
     Hashes are computed live with Web Crypto, so every value on screen is real.
     Driven by postMessage({step}) from the deck, and standalone with arrow keys / buttons. */
  :root {
    --bg: #0b1222; --panel: #111b30; --line: #263349; --text: #e2e8f0; --muted: #94a3b8;
    --amber: #fbbf24; --cyan: #38bdf8; --coral: #fb7185; --emerald: #34d399; --violet: #a78bfa;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  main { padding: 16px 22px; max-width: 1180px; margin: 0 auto; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .step-no { font: 800 15px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #04111d; background: var(--cyan); border-radius: 6px; padding: 5px 9px; }
  .step-title { font-size: 22px; font-weight: 700; }
  .step-title b { color: var(--amber); }
  .wrap { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); }
  th { text-align: left; font: 700 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid rgba(38,51,73,.6); font-size: 16px; vertical-align: middle; }
  .user { color: var(--text); font-weight: 600; }
  .val { color: var(--amber); word-break: break-all; }
  .val.hash { color: var(--cyan); }
  .val.salted { color: var(--emerald); }
  tr.shared td { background: rgba(251,113,133,.12); }
  tr.shared .val { color: var(--coral); }
  .tag { font: 700 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; border-radius: 5px; padding: 3px 7px; margin-left: 6px; vertical-align: middle; }
  .tag.found { background: rgba(251,113,133,.18); color: var(--coral); }
  .tag.safe { background: rgba(52,211,153,.18); color: var(--emerald); }
  .salt { color: var(--violet); font-size: 13px; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  aside h3 { margin: 0 0 8px; font-size: 17px; color: var(--cyan); }
  aside p { margin: 0 0 10px; font-size: 15px; line-height: 1.45; color: var(--text); }
  aside p.q { color: var(--muted); }
  .lookup { margin-top: 6px; font-family: var(--mono); font-size: 15px; }
  .lookup .k { color: var(--muted); }
  .lookup .hit { color: var(--coral); font-weight: 700; }
  .lookup .miss { color: var(--emerald); font-weight: 700; }
  .meter { margin-top: 10px; font-family: var(--mono); font-size: 15px; line-height: 1.7; }
  .meter .bar { display: inline-block; height: 10px; border-radius: 5px; vertical-align: middle; }
  .big { font-size: 20px; font-weight: 800; }
  .coral { color: var(--coral); } .emerald { color: var(--emerald); } .amber { color: var(--amber); } .cyan { color: var(--cyan); }
  .nav { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 8px; z-index: 10; }
  .nav button { font: 600 15px/1 var(--sans); border-radius: 9px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: #16213a; color: var(--text); }
  .nav button:disabled { opacity: .4; cursor: default; }
  .dots { position: fixed; left: 22px; bottom: 20px; display: flex; gap: 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
  .dots i.on { background: var(--cyan); }
  .checklist { margin: 4px 0 0; padding-left: 18px; }
  .checklist li { font-size: 14px; line-height: 1.5; color: var(--text); margin-bottom: 2px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <span class="step-no" id="stepNo">STEP 1</span>
    <span class="step-title" id="stepTitle"></span>
  </div>
  <div class="wrap">
    <div>
      <table>
        <thead><tr>
          <th>User</th>
          <th id="hSalt" style="display:none">Salt</th>
          <th id="hStored">Password (plaintext)</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <aside id="panel"></aside>
  </div>
</main>
<div class="dots" id="dots"></div>
<div class="nav">
  <button id="prev" type="button">&larr; Prev</button>
  <button id="next" type="button">Next &rarr;</button>
</div>

<script>
// ---- live hashing helpers (Web Crypto) ----
var enc = new TextEncoder();
async function sha256hex(str) {
  var buf = await crypto.subtle.digest("SHA-256", enc.encode(str));
  return [].map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}
function short(hex) { return hex ? hex.slice(0, 20) + "…" : ""; }

// PBKDF2 = a real slow hash, for the timing demo
async function pbkdf2(pw, salt, iters) {
  var key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: iters, hash: "SHA-256" }, key, 256);
}

// users: alice and bob happen to pick the SAME password (the teaching point)
var USERS = [
  { name: "alice", pw: "password123", salt: "7c2e91a4" },
  { name: "bob",   pw: "password123", salt: "d04a3f18" },
  { name: "carol", pw: "sunflower",   salt: "3b8fe5c0" }
];
// a tiny "rainbow table": precomputed hash -> plaintext for common passwords
var DICT = ["password123", "123456", "qwerty", "sunflower", "letmein", "iloveyou", "admin", "welcome"];
var rainbow = {};        // sha256(plain) -> plain
var H = {};              // per-user computed hashes (plain + salted)
var PEPPER = "k7$Qz";

var state = { step: 1, timing: null };

async function prep() {
  for (var i = 0; i < DICT.length; i++) rainbow[await sha256hex(DICT[i])] = DICT[i];
  for (var u = 0; u < USERS.length; u++) {
    var us = USERS[u];
    H[us.name] = {
      plain: await sha256hex(us.pw),
      salted: await sha256hex(us.salt + us.pw),
      peppered: await sha256hex(us.salt + us.pw + PEPPER)
    };
  }
  render();
}

var TITLES = {
  1: 'Plaintext. <b>One leak, every account gone.</b>',
  2: 'Hashed. A one-way fingerprint. <b>Safe now?</b>',
  3: 'Rainbow table. They are not cracking, they are <b>looking it up.</b>',
  4: 'A second leak. <b>Same value means same password.</b>',
  5: 'Salt. A unique value per user. <b>The lookup fails.</b>',
  6: 'Still guessable. <b>Salt made them work, not slow.</b>',
  7: 'Slow hashing. bcrypt, scrypt, Argon2. <b>Guessing collapses.</b>',
  8: 'Pepper, and what to do <b>after a leak.</b>'
};

function rowsHTML() {
  // which users are "leaked" on screen: steps 1-3 show alice; step 4+ show alice & bob (second leak); carol joins at salt
  var showBob = state.step >= 4;
  var showCarol = state.step >= 5;
  var list = USERS.filter(function (u) {
    if (u.name === "bob") return showBob;
    if (u.name === "carol") return showCarol;
    return true;
  });
  var saltCol = state.step >= 5;
  document.getElementById("hSalt").style.display = saltCol ? "" : "none";
  var storedHead = state.step === 1 ? "Password (plaintext)"
    : state.step >= 7 ? "Stored (slow hash)"
    : state.step >= 5 ? "Stored (salt + hash)"
    : "Stored (hash)";
  document.getElementById("hStored").textContent = storedHead;

  return list.map(function (u) {
    var h = H[u.name];
    var shared = state.step === 4 && (u.name === "alice" || u.name === "bob");
    var stored, cls = "val";
    if (state.step === 1) { stored = u.pw; }
    else if (state.step <= 4) { stored = short(h.plain); cls = "val hash"; }
    else if (state.step <= 6) { stored = short(h.salted); cls = "val salted"; }
    else if (state.step === 7) { stored = "pbkdf2$210000$" + short(h.salted).slice(0, 12); cls = "val salted"; }
    else { stored = short(h.peppered); cls = "val salted"; }
    var tag = "";
    if (state.step === 3 && rainbow[h.plain]) tag = '<span class="tag found">looked up: ' + rainbow[h.plain] + '</span>';
    if (state.step === 4 && shared) tag = '<span class="tag found">same as ' + (u.name === "alice" ? "bob" : "alice") + '</span>';
    if (state.step === 5) tag = '<span class="tag safe">lookup fails</span>';
    var saltCell = saltCol ? '<td class="salt">' + u.salt + '</td>' : '';
    return '<tr class="' + (shared ? "shared" : "") + '">' +
      '<td class="user">' + u.name + '</td>' + saltCell +
      '<td><span class="' + cls + '">' + stored + '</span>' + tag + '</td></tr>';
  }).join("");
}

function panelHTML() {
  var s = state.step, h = H.alice;
  if (s === 1) return '<h3>Plaintext</h3><p>The database stores the password exactly as typed.</p><p class="q">If this table leaks, the attacker logs in as everyone. No work at all.</p>';
  if (s === 2) return '<h3>Hashing</h3><p>Each password becomes a fixed one-way fingerprint. You cannot reverse it back to the password.</p><p class="q">So a stolen table is just hashes. Safe?</p>';
  if (s === 3) return '<h3>Rainbow table</h3><p>Attackers precompute the hash of every common password once, then just <b>look up</b> the stolen hash.</p>' +
    '<div class="lookup"><span class="k">lookup(</span>' + short(h.plain) + '<span class="k">)</span> &rarr; <span class="hit">' + rainbow[h.plain] + '</span></div>' +
    '<p class="q" style="margin-top:10px">They never cracked anything. They looked it up. Try the same hash on crackstation.net.</p>';
  if (s === 4) return '<h3>Shared passwords</h3><p>alice and bob picked the same password, so their stored hashes are <b class="coral">identical</b>.</p><p class="q">One leak exposes every account that reused that password, with zero cracking.</p>';
  if (s === 5) return '<h3>Salt</h3><p>Add a unique random <span style="color:var(--violet)">salt</span> per user before hashing. Same password now gives <b class="emerald">totally different</b> stored values.</p>' +
    '<div class="lookup"><span class="k">lookup(</span>' + short(h.salted) + '<span class="k">)</span> &rarr; <span class="miss">NOT FOUND</span></div>' +
    '<p class="q" style="margin-top:10px">Precomputed tables are now useless. The salt is not secret, only unique.</p>';
  if (s === 6) return '<h3>Still guessable</h3><p>Salt stopped the <i>lookup</i>, not the <i>guessing</i>. Fast hashes let an attacker test billions of guesses a second, salt and all.</p>' +
    '<div class="meter" id="meter6"><span class="k">measuring…</span></div>' +
    '<p class="q">Salt made them work. It did not make them slow.</p>';
  if (s === 7) return '<h3>Slow hashing</h3><p>Use a deliberately slow hash: bcrypt, scrypt, Argon2 (here, PBKDF2). A delay nobody notices on one login is fatal to billions of guesses.</p>' +
    '<div class="meter" id="meter7"><span class="k">timing a fast hash vs a slow one…</span></div>' +
    '<p class="q">Never invent your own. Use a standard slow hash.</p>';
  if (s === 8) return '<h3>Pepper + after a leak</h3><p>A <b>pepper</b> is one extra secret kept <i>outside</i> the database, mixed in before hashing. A leaked DB alone is not enough.</p>' +
    '<p style="margin:4px 0 2px;font-weight:600">If you are breached:</p>' +
    '<ul class="checklist"><li>Force password resets</li><li>Invalidate every session token</li><li>Re-hash on next login</li><li>Notify within 72 hours (RA 10173)</li><li>Warn users to change it anywhere reused</li></ul>';
  return "";
}

async function measure6() {
  var el = document.getElementById("meter6");
  if (!el) return;
  var t0 = performance.now(), N = 2000;
  for (var i = 0; i < N; i++) await sha256hex("guess" + i);
  var ms = performance.now() - t0;
  var perSec = Math.round(N / (ms / 1000));
  // a real cracking rig is far faster than one browser tab; show the idea
  el.innerHTML = '<div>this tab: <span class="amber">' + perSec.toLocaleString() + '</span> guesses/sec</div>' +
    '<div>a GPU rig: <span class="coral">~10,000,000,000</span>/sec</div>' +
    '<div class="k">"password123" falls in <span class="coral">under a second</span></div>';
}
async function measure7() {
  var el = document.getElementById("meter7");
  if (!el) return;
  var t0 = performance.now(); for (var i = 0; i < 500; i++) await sha256hex("x" + i);
  var fast = (performance.now() - t0) / 500;
  var t1 = performance.now(); await pbkdf2("password123", "7c2e91a4", 210000);
  var slow = performance.now() - t1;
  var factor = Math.round(slow / fast);
  el.innerHTML = '<div>fast SHA-256: <span class="emerald">' + fast.toFixed(3) + ' ms</span></div>' +
    '<div>slow PBKDF2: <span class="coral">' + slow.toFixed(0) + ' ms</span> (×' + factor.toLocaleString() + ')</div>' +
    '<div class="k">10 billion/sec becomes a few thousand/sec</div>';
}

function render() {
  document.getElementById("stepNo").textContent = "STEP " + state.step;
  document.getElementById("stepTitle").innerHTML = TITLES[state.step];
  document.getElementById("rows").innerHTML = rowsHTML();
  document.getElementById("panel").innerHTML = panelHTML();
  var dots = ""; for (var i = 1; i <= 8; i++) dots += '<i class="' + (i <= state.step ? "on" : "") + '"></i>';
  document.getElementById("dots").innerHTML = dots;
  document.getElementById("prev").disabled = state.step <= 1;
  document.getElementById("next").disabled = state.step >= 8;
  if (state.step === 6) measure6();
  if (state.step === 7) measure7();
}

function go(step) { state.step = Math.max(1, Math.min(8, step)); render(); }

document.getElementById("prev").onclick = function () { go(state.step - 1); };
document.getElementById("next").onclick = function () { go(state.step + 1); };
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { go(state.step + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { go(state.step - 1); e.preventDefault(); }
});
// driven by the deck
window.addEventListener("message", function (e) {
  if (e.data && typeof e.data.step === "number" && e.data.step >= 1) go(e.data.step);
});

var qs = new URLSearchParams(location.search).get("step");
if (qs) state.step = Math.max(1, Math.min(8, +qs));
prep();
</script>
</body>
</html>
